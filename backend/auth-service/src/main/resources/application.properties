spring.application.name=auth-service

# DATABASE: MySQL configuration similar to user-service
spring.datasource.url=jdbc:mysql://localhost:3306/team_task_management_auth
spring.datasource.username=root
spring.datasource.password=root123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SERVER: Port configuration (different from user-service port 8082)
server.port=8080

# DATABASE: Connection pool configuration (same as user-service)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JWT: Token configuration
app.jwt.secret=bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25BbmRWYWxpZGF0aW9u
app.jwt.access-token-expiration=900
app.jwt.refresh-token-expiration=604800

# USER SERVICE: Integration configuration
app.user-service.url=http://localhost:8082
app.user-service.timeout=5000

# SECURITY: Password configuration
app.password.bcrypt-rounds=12

# CLEANUP: Token cleanup configuration
app.cleanup.expired-tokens-cron=0 0 */6 * * *
app.cleanup.account-lockout-reset-cron=0 */30 * * * *

# LOGGING: Log levels
logging.level.com.example.authservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG